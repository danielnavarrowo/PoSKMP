name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Prepare Android Artifacts
        run: |
          mkdir -p artifacts/android
          find androidApp/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} artifacts/android/ \;

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/android/*
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            artifact_name: desktop-linux
          - os: windows-latest
            os_name: Windows
            artifact_name: desktop-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Packaging Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (Linux)
        if: runner.os == 'Linux'
        run: chmod +x gradlew

      - name: Build Desktop Distribution (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --stacktrace

      - name: Build Desktop Distribution (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :desktopApp:packageReleaseDistributionForCurrentOS --stacktrace

      - name: Package Desktop Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/desktop-linux
          # Copy .deb and .rpm packages
          find desktopApp/build/compose/binaries/main-release/ -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} artifacts/desktop-linux/ \; || true

          # Build standalone .AppImage using appimagetool
          APP_DIR_SRC=$(find desktopApp/build/compose/binaries/main-release/app -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$APP_DIR_SRC" ] && [ -d "$APP_DIR_SRC" ]; then
            echo "Building AppImage from $APP_DIR_SRC..."
            mkdir -p AppDir
            cp -r "$APP_DIR_SRC"/* AppDir/

            # Create AppRun launcher
            EXE_NAME=$(ls AppDir/bin | head -n 1)
            printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/bin/%s" "$@"\n' "$EXE_NAME" > AppDir/AppRun
            chmod +x AppDir/AppRun

            # Desktop file
            printf '[Desktop Entry]\nType=Application\nName=PoSKMP\nExec=AppRun\nIcon=poskmp\nCategories=Office;Utility;\n' > AppDir/poskmp.desktop

            # Icon
            ICON_SRC=$(find AppDir -name "*.png" | head -n 1)
            if [ -n "$ICON_SRC" ]; then
              cp "$ICON_SRC" AppDir/poskmp.png
            else
              cp androidApp/src/main/res/mipmap-xxxhdpi/ic_launcher.png AppDir/poskmp.png || true
            fi

            # Download and run appimagetool
            wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
            chmod +x appimagetool
            ./appimagetool --appimage-extract
            export ARCH=x86_64
            ./squashfs-root/AppRun AppDir artifacts/desktop-linux/PoSKMP-x86_64.AppImage
            rm -rf AppDir squashfs-root appimagetool
          fi

      - name: Package Desktop Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/desktop-windows
          Get-ChildItem -Path desktopApp/build/compose/binaries/main-release -Recurse -Include *.msi, *.exe | Copy-Item -Destination artifacts/desktop-windows

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-android, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Gather release assets
        run: |
          mkdir -p release-assets
          find downloaded-artifacts/ -type f -exec cp {} release-assets/ \;
          echo "Release assets prepared:"
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
